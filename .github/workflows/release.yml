name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (e.g. 0.1.0-poc.2 or 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

# Serialize all versions so automatic scoreboard release IDs cannot overlap.
concurrency:
  group: bridge-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run Release from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Prepare version and allocate release ID
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin --tags
          python3 scripts/release.py prepare --version "$RELEASE_VERSION"

      - name: Reject an existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Listing must succeed; an authentication/API error is never treated as absence.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/bridge-release-tags.txt"
          if grep -Fxq -- "$TAG" "$RUNNER_TEMP/bridge-release-tags.txt"; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

      - name: Build and test both components
        run: ./gradlew clean build --no-daemon

      - name: Verify artifact versions and generate checksums
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/release.py verify --version "$RELEASE_VERSION"

      - name: Commit release metadata and push annotated tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add bridge.properties datapack/pack.mcmeta \
            datapack/data/feato_gun_valhalla/function/bridge/marker.mcfunction
          git commit -m "chore: prepare release $TAG"
          git tag --annotate "$TAG" --message "FEATO Gun-Valhalla Bridge $TAG"
          git push origin "refs/tags/$TAG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ steps.release.outputs.version }}
          if-no-files-found: error
          path: |
            plugin/build/libs/feato-gun-valhalla-bridge-plugin-${{ steps.release.outputs.version }}.jar
            plugin/build/distributions/feato-gun-valhalla-bridge-datapack-${{ steps.release.outputs.version }}.zip
            plugin/build/release/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          cat > "$RUNNER_TEMP/bridge-release-notes.md" <<EOF
          FEATO Gun-Valhalla Bridge $TAG

          Plugin and Datapack must be installed together. Bridge release ID: $RELEASE_ID.
          Targets: Minecraft 26.2 / Paper build 126 / ValhallaMMO 1.10.3 /
          Gun Core V1.0.15 / Modern Guns V1.9.3.

          Status: Phase 1 complete by user verification. Phase 2 raycast, burst and
          shotgun adapter is ready for live verification; slowcast and explosion
          attribution are not implemented (observation only). Phase 3 and gun gameplay
          effects are not implemented. Respec/recalculation remains deferred.
          See docs/poc.md in the tagged source for verification procedures.
          EOF
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            "plugin/build/libs/feato-gun-valhalla-bridge-plugin-$RELEASE_VERSION.jar" \
            "plugin/build/distributions/feato-gun-valhalla-bridge-datapack-$RELEASE_VERSION.zip" \
            plugin/build/release/SHA256SUMS \
            --verify-tag --title "FEATO Gun-Valhalla Bridge $TAG" \
            --notes-file "$RUNNER_TEMP/bridge-release-notes.md" "${flags[@]}"
